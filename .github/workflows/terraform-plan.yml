name: Terraform Plan (Self-Service VM Planner)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:

      vm_size:
        description: "Azure VM Size (Example: Standard_B2s, Standard_D2s_v3)"
        required: true
        default: "Standard_B2s"

      os_type:
        description: "Operating System"
        required: true
        type: choice
        options:
          - linux
          - windows

      disk_size:
        description: "Disk Size (GB)"
        required: true
        default: "30"

      location:
        description: "Azure Region"
        required: true
        default: "eastus"

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Show Selected Configuration
        run: |
          echo "VM Size: ${{ github.event.inputs.vm_size }}"
          echo "OS Type: ${{ github.event.inputs.os_type }}"
          echo "Disk Size: ${{ github.event.inputs.disk_size }}"
          echo "Region: ${{ github.event.inputs.location }}"

      # ✅ Suggest Disk
      - name: Suggest Disk Size Based on OS
        run: |
          echo "Checking disk recommendation..."

          if [ "${{ github.event.inputs.os_type }}" == "windows" ]; then
            recommended_disk=127
          else
            recommended_disk=30
          fi

          echo "Recommended Disk Size: ${recommended_disk}GB"

          if [ "${{ github.event.inputs.disk_size }}" -lt "$recommended_disk" ]; then
            echo "⚠️ Provided disk size is too small"
          else
            echo "✅ Disk size is valid"
          fi

      # ✅ VM Recommendations
      - name: Show Recommended VM Types
        run: |
          echo "Recommended VM types:"

          if [ "${{ github.event.inputs.os_type }}" == "linux" ]; then
            echo "- Standard_B1s"
            echo "- Standard_B2s"
            echo "- Standard_D2s_v3"
          else
            echo "- Standard_B2s"
            echo "- Standard_D2s_v3"
            echo "- Standard_D4s_v3"
          fi

      # ✅ Terraform Plan
      - name: Terraform Plan
        run: |
          if [ "${{ github.event.inputs.os_type }}" == "windows" ] && [ "${{ github.event.inputs.disk_size }}" -lt 127 ]; then
            disk=127
            echo "⚠️ Auto-corrected disk to 127GB"
          elif [ "${{ github.event.inputs.os_type }}" == "linux" ] && [ "${{ github.event.inputs.disk_size }}" -lt 30 ]; then
            disk=30
            echo "⚠️ Auto-corrected disk to 30GB"
          else
            disk=${{ github.event.inputs.disk_size }}
          fi

          terraform plan \
            -refresh=false \
            -var="vm_size=${{ github.event.inputs.vm_size }}" \
            -var="os_type=${{ github.event.inputs.os_type }}" \
            -var="disk_size=$disk" \
            -var="location=${{ github.event.inputs.location }}" \
            -var-file="environments/dev.tfvars" \
            -no-color > plan.txt

          cat plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: plan.txt